<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaruDungeon 페이지 미리보기</title>
<style>
  /* itch.io 기본 게임 페이지 배치를 흉내 낸 미리보기 — 색은 README.md 2번 테마 값 */
  :root { --bg: #0B0C10; --bg2: #16181F; --text: #E6E8EE; --link: #FFCE5C; --button: #EE8C29; --muted: #9AA0AE; }
  body { margin: 0; background: var(--bg) url("background_tile_256.png") repeat; color: var(--text);
         font-family: Lato, "Malgun Gothic", sans-serif; image-rendering: pixelated; }
  .page { max-width: 960px; margin: 0 auto 40px; }
  .banner { display: block; width: 100%; image-rendering: pixelated; }
  .column { background: var(--bg2); display: flex; gap: 24px; padding: 24px; }
  .left { flex: 1 1 auto; min-width: 0; }
  .right { flex: 0 0 300px; }
  .right img { width: 100%; display: block; margin-bottom: 12px; image-rendering: pixelated; }
  h1 { margin: 0 0 12px; font-size: 32px; color: var(--link); }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  a { color: var(--link); }
  hr { border: 0; border-top: 1px solid #2a2e3a; }
  table td { padding: 3px 12px 3px 0; vertical-align: top; }
  table td:first-child { color: var(--muted); white-space: nowrap; }
  .download { margin-top: 28px; display: flex; align-items: center; gap: 12px; }
  .btn { background: var(--button); color: #fff; font-weight: bold; padding: 8px 18px; border-radius: 3px; }
  .muted { color: var(--muted); }
  @media (max-width: 760px) { .column { flex-direction: column; } .right { flex-basis: auto; } }
</style>
</head>
<body>
<div class="page">
  <img class="banner" src="banner_960x400.png" alt="NaruDungeon 배너">
  <div class="column">
    <div class="left">
      <h1>NaruDungeon</h1>
      <div id="desc"></div>
      <div class="download"><span class="btn">Download</span> NaruDungeon.zip <span class="muted">92 MB</span></div>
    </div>
    <div class="right">
      <img src="screenshot_1_explore.png" alt="">
      <img src="screenshot_2_dungeon.png" alt="">
      <img src="screenshot_3_enemies.png" alt="">
      <img src="screenshot_4_items.png" alt="">
    </div>
  </div>
</div>
<script>
  fetch('description.html').then(r => r.text()).then(t => { document.getElementById('desc').innerHTML = t; })
    .catch(() => { document.getElementById('desc').textContent = '(description.html을 같은 폴더에서 여세요)'; });
</script>
</body>
</html>
